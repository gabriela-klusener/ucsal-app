
<ion-view view-title="Meu Cadastro">

    <ion-content class="content-background">

        <div class="page-heading">
            <h2>Dados cadastrais</h2>
            <p>Consulte e atualize suas informações.</p>
        </div>

        <div class="card profile-card">

            <div class="item item-divider">
                Informações institucionais
            </div>

            <div class="item item-input">
                <span class="input-label">Nome</span>

                <input
                    type="text"
                    ng-model="aluno.nome"
                    ng-disabled="true">
            </div>

            <div class="item item-input">
                <span class="input-label">Matrícula</span>

                <input
                    type="text"
                    ng-model="aluno.matricula"
                    ng-disabled="true">
            </div>

            <div class="item item-input">
                <span class="input-label">Curso</span>

                <input
                    type="text"
                    ng-model="aluno.curso"
                    ng-disabled="true">
            </div>

        </div>


        <div class="card profile-card">

            <div class="item item-divider">
                Informações pessoais
            </div>

            <label class="item item-input">
                <span class="input-label">E-mail</span>

                <input
                    type="email"
                    ng-model="aluno.email">
            </label>

            <label class="item item-input">
                <span class="input-label">Telefone</span>

                <input
                    type="tel"
                    ng-model="aluno.telefone">
            </label>

        </div>


        <div class="card profile-card">

            <div class="item item-divider">
                Endereço
            </div>

            <label class="item item-input">
                <span class="input-label">CEP</span>

                <input
                    type="text"
                    ng-model="aluno.cep">
            </label>

            <label class="item item-input">
                <span class="input-label">Rua</span>

                <input
                    type="text"
                    ng-model="aluno.rua">
            </label>

            <label class="item item-input">
                <span class="input-label">Bairro</span>

                <input
                    type="text"
                    ng-model="aluno.bairro">
            </label>

            <label class="item item-input">
                <span class="input-label">Cidade</span>

                <input
                    type="text"
                    ng-model="aluno.cidade">
            </label>

        </div>


        <div class="padding">

            <button
                class="button button-block button-ucsal"
                ng-click="salvar()">

                Salvar Alterações

            </button>

        </div>

    </ion-content>

</ion-view>
