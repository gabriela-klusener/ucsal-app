
<ion-side-menus ng-controller="MenuCtrl">
    <ion-side-menu-content>

        <ion-nav-bar class="bar-ucsal">

            <ion-nav-back-button></ion-nav-back-button>

            <ion-nav-buttons side="left">

                <button
                    class="button button-icon ion-navicon"
                    menu-toggle="left">
                </button>

            </ion-nav-buttons>

        </ion-nav-bar>

        <ion-nav-view name="menuContent"></ion-nav-view>

    </ion-side-menu-content>


    <ion-side-menu side="left">

        <ion-header-bar class="bar-ucsal">
            <h1 class="title">Portal UCSal</h1>
        </ion-header-bar>

        <ion-content>

            <div class="menu-profile">
                <i class="icon ion-university"></i>

                <h3>{{alunoLogado.nome}}</h3>

                <p>{{alunoLogado.curso}}</p>
            </div>

            <ion-list>

                <ion-item
                    menu-close
                    ui-sref="app.noticias">

                    <i class="icon ion-home"></i>
                    Página Inicial

                </ion-item>

                <ion-item
                    menu-close
                    ui-sref="app.perfil">

                    <i class="icon ion-person"></i>
                    Meu Cadastro

                </ion-item>

                <ion-item
                    menu-close
                    ui-sref="app.financeiro">

                    <i class="icon ion-card"></i>
                    Financeiro

                </ion-item>

                <ion-item
                    menu-close
                    ng-click="sair()">

                    <i class="icon ion-log-out"></i>
                    Sair

                </ion-item>

            </ion-list>

        </ion-content>

    </ion-side-menu>

</ion-side-menus>
