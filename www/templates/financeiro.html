
<ion-view view-title="Financeiro">

    <ion-content class="content-background">

        <div class="page-heading">

            <h2>Consulta Financeira</h2>

            <p>Consulte suas mensalidades por semestre.</p>

        </div>

        
        <div class="card">

            <div class="item item-text-wrap">

                <label class="item item-input item-select">

                    <div class="input-label">
                        Semestre
                    </div>

                    <select ng-model="semestreSelecionado"
                            ng-options="semestre for semestre in semestres">

                    </select>

                </label>

            </div>

        </div>


        <div class="card finance-card">

            <div class="item item-divider">
                Mensalidades - {{semestreSelecionado}}
            </div>

            <div
                class="item item-text-wrap"
                ng-repeat="parcela in mensalidades | filter:{semestre: semestreSelecionado}">

                <div class="row">

                    <div class="col">

                        <h2>{{parcela.mes}}</h2>

                        <p>Vencimento: {{parcela.vencimento}}</p>

                        <h3 class="finance-value">
                            {{parcela.valor | currency:'R$ '}}
                        </h3>

                    </div>

                    <div class="col col-33 text-right">

                        <span
                            class="status-badge"
                            ng-class="parcela.status === 'Paga' ? 'status-paga' : 'status-pendente'">

                            {{parcela.status}}

                        </span>

                    </div>

                </div>

                <button
                    ng-if="parcela.status === 'A Pagar'"
                    class="button button-small button-outline button-ucsal"
                    ng-click="copiarCodigo(parcela.codigoBarras)">

                    <i class="icon ion-clipboard"></i>
                    Copiar Código de Barras

                </button>

            </div>

            <div
                class="item item-text-wrap"
                ng-if="(mensalidades | filter:{semestre: semestreSelecionado}).length === 0">

                Nenhuma mensalidade encontrada para esse semestre.

            </div>

        </div>

    </ion-content>

</ion-view>
